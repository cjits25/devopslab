<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Fest Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4A90E2,#6A5ACD);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#1f3c88;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

span{
    color:red;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border:2px solid #1f3c88;
}

button{
    width:100%;
    padding:14px;
    background:#1f3c88;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#16306d;
}
</style>

</head>
<body>

<div class="container">
    <h1>Student Fest</h1>
    <p>Registration Form</p>

    <form id="registrationForm">

        <div class="input-group">
            <label for="name">Student Name <span>*</span></label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="input-group">
            <label for="father">Father's Name</label>
            <input type="text" id="father" placeholder="Enter your father's name">
        </div>

        <div class="input-group">
            <label for="dob">Date of Birth <span>*</span></label>
            <input type="date" id="dob">
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label for="phone">Phone Number <span>*</span></label>
            <input type="tel" id="phone" placeholder="Enter your phone number">
        </div>

        <div class="input-group">
            <label for="college">College Name <span>*</span></label>
            <input type="text" id="college" placeholder="Enter your college name">
        </div>

        <button type="submit">Register</button>

    </form>
</div>

<script src="script.js"></script>

</body>
</html>
