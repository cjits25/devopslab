{% extends "base.html" %}

{% block title %}
Student Registration
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow mt-5">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Student Registration</h3>

                </div>

                <div class="card-body">

                    <form method="POST"
                          onsubmit="return validateRegistration()">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   id="username"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   id="password"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Branch
                            </label>

                            <select class="form-select"
                                    name="branch"
                                    required>

                                <option value="">
                                    Select Branch
                                </option>

                                <option value="CSE">
                                    CSE
                                </option>

                                <option value="ECE">
                                    ECE
                                </option>

                                <option value="EEE">
                                    EEE
                                </option>

                                <option value="Civil">
                                    Civil
                                </option>

                                <option value="Mechanical">
                                    Mechanical
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Year
                            </label>

                            <select class="form-select"
                                    name="year"
                                    required>

                                <option value="">
                                    Select Year
                                </option>

                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <select class="form-select"
                                    name="semester"
                                    required>

                                <option value="">
                                    Select Semester
                                </option>

                                <option value="1">
                                    Semester 1
                                </option>

                                <option value="2">
                                    Semester 2
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email ID
                            </label>

                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   required>

                        </div>


                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">

                                Register

                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-3">

                        Already registered?

                        <a href="{{ url_for('login') }}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
