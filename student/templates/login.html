{% extends "base.html" %}

{% block title %}
Student Login
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow mt-5">

                <div class="card-header bg-dark text-white text-center">

                    <h3>Student Login</h3>

                </div>


                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   required>

                        </div>


                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-success">

                                Login

                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-3">

                        New Student?

                        <a href="{{ url_for('register') }}">
                            Register Here
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
